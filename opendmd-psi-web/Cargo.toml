[package]
name = "opendmd-psi-web"
version = "1.0.0"
edition = "2021"
description = "The web app's Formulas: Psi (opendmd-psi) compiled to wasm, loaded lazily when the Library's Formulas tab opens."
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendmd/opendmd"
publish = false

[lib]
# cdylib is what wasm-pack links; rlib for `cargo test` and `wasm-pack test --node`.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same crate the firmware and the simulator run (through opendmd-core's
# `psi` feature), with its own copies of core's sine and palettes (the
# `tables` feature; core's tests check they are equal), so a formula's frame
# here is the panel's, byte for byte.
opendmd-psi = { path = "../opendmd-psi" }
# No std (see src/lib.rs): wasm-bindgen without it.
wasm-bindgen = { version = "0.2", default-features = false }

[features]
# In wasm: no std (a panic is a trap) — `make web` builds with both; the
# tests, which need std, with `bump` only. See src/lib.rs.
bare = []
# In wasm: the bump allocator (src/bump.rs) instead of std's.
bump = []

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# "z" since parts (2026-10-25): 1.6 KB gz smaller than "s"; the preview's
# frames ~25 % slower, still ~0.1 ms (opendmd-notes docs/research/psi-combine.md).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
