name: Release

# The one publisher of a release (docs/deploying.md "Releasing"). The dev box
# builds and checks the release and pushes its tag (`make release
# VERSION=... PUBLISH=1`, tools/release.sh); this workflow, on that tag:
#
#   1. builds it with `make fw-release` for the flash layout (4mb, the ESP32
#      DevKit V1): the firmware, its bootloader and partition table, the
#      merged image, the ESP Web Tools manifest and the .odfw bundle signed
#      with OTA_SIGNING_KEY, the updater and the web app's pack; checks the
#      version in each, and that the bundle and the pack verify against the
#      committed firmware/keys/opendmd.pub; a beta ("-" version) is built
#      with Remote control (`connect`, its setting off; the Makefile's
#      FW_BETA_FEATURES), a final without, and the app is checked for it;
#   2. publishes the GitHub release (tools/release-publish.sh: a draft until
#      every asset is up, then a pre-release for a "-" version, else marked
#      latest).
#
# The site (https://opendmd.dev/: the installer, install/release.json and
# install/beta.json, the public gallery repo's API pages) is not built here:
# the site's own repository builds it against this release and deploys it
# from the maintainer's machine once the release is published (tools/release.sh
# with SITE_REPO does both; docs/deploying.md "The site"). Players see the
# release in their update check only after that deploy.
#
#   tag v1.2.3          -> a final (the site's release.json and beta.json name it)
#   tag v1.2.3-beta.1   -> a beta (a beta after a final is the site's
#                          beta.json only; docs/deploying.md "Betas")
#   manual dispatch     -> dry_run (the default): everything is built, signed
#                          with a throwaway key made in the job (so the bundle
#                          verifies against that key's public half, not the
#                          committed firmware/keys/opendmd.pub), and dist/ is
#                          uploaded as a build artifact; nothing is published.
#                          Untick dry_run and pick a v* tag in "Use workflow
#                          from" to rerun a tag's release.
#
# A rerun is safe ("Re-run all jobs", or the dispatch above; not "Re-run
# failed jobs", which keeps the first attempt's plan): once a tag's
# GitHub release is published its assets ARE the release, so a rerun builds
# no firmware, downloads them (checked against their SHA256SUMS and
# opendmd.pub) and goes on from there; a draft left by a run that stopped is
# completed. Nothing published is ever replaced.
#
# Refused or skipped:
# - the tag must equal firmware/Cargo.toml's version with a leading "v", and
#   be newer than every other v* tag (an older tag's release is never redone);
# - a tag that tools/release.sh published itself (PUBLISH=local, while CI was
#   down: its annotated tag says "Publisher: local") is skipped whole;
# - a real release with a secret below missing fails before it builds.
#
# The repository secret (Settings > Secrets and variables > Actions), for a
# real release; a dry run needs none:
#   OTA_SIGNING_KEY   base64 of the raw 32-byte Ed25519 seed that signs the
#                     .odfw bundles and the www pack (tools/fw-sign.py; the key
#                     whose public half is firmware/keys/opendmd.pub):
#                       base64 -w0 ~/.config/opendmd/opendmd.key | gh secret set OTA_SIGNING_KEY -R opendmd/opendmd
# The release itself is made with the workflow's own GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build with a throwaway key, publish nothing"
        type: boolean
        default: true
  push:
    tags: ["v*"]

# One release at a time, whatever the tag: two tags pushed close together
# publish in turn, the second seeing the first's release. (GitHub keeps one
# run waiting per group: a third queued while one waits cancels the waiting
# one, which is then run again by hand: "Re-run all jobs".)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      kind: ${{ steps.plan.outputs.kind }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      final: ${{ steps.plan.outputs.final }}
      adopt: ${{ steps.plan.outputs.adopt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out what to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_INPUT: ${{ inputs.dry_run }}
          # Only whether the secret is set, never its value.
          HAVE_OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY != '' }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' firmware/Cargo.toml | head -1)"
          test -n "$VERSION" || { echo "::error::cannot read the version from firmware/Cargo.toml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Newer than every other v* tag, as release.sh insists: a final below
          # a live beta would otherwise take the site's beta.json back to the
          # final, and an old tag's rerun would publish an older release.
          NEWEST="$(tools/release-tags.sh newest "$VERSION")"
          [ "$NEWEST" = "$VERSION" ] || { echo "::error::$VERSION is not newer than every v* tag (newest: $NEWEST)"; exit 1; }
          # The channel: a beta after a final release updates beta.json only
          # (release.json stays on the newest final, FINAL); anything else both.
          # 0.x finals (v0.3.0) predate the channels: not counted.
          FINAL="$(tools/release-tags.sh newest-final "$VERSION")"
          if [[ "$VERSION" == *-* && -n "$FINAL" ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"; echo "final=$FINAL" >> "$GITHUB_OUTPUT"
            echo "Channel: beta (after the final $FINAL): beta.json names $VERSION, release.json stays on $FINAL"
          else
            echo "channel=both" >> "$GITHUB_OUTPUT"; echo "final=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Channel: both: release.json and beta.json name $VERSION"
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DRY_INPUT" != false ]]; then
            echo "kind=dry" >> "$GITHUB_OUTPUT"; echo "adopt=false" >> "$GITHUB_OUTPUT"
            echo "Dry run of $VERSION at $(git describe --always --tags)"
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::a release needs a v* tag (picked in 'Use workflow from'), not $GITHUB_REF; or tick dry_run"
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          if [[ "${TAG#v}" != "$VERSION" ]]; then
            echo "::error::tag $TAG does not match firmware/Cargo.toml's version $VERSION (want tag v$VERSION, or bump the version)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The tag as pushed (an annotated tag; checkout may have written its own ref).
          git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] || { echo "::error::$TAG is not an annotated tag (tools/release.sh makes one)"; exit 1; }
          if git cat-file -p "refs/tags/$TAG" | sed '1,/^$/d' | grep -qx 'Publisher: local'; then
            echo "kind=local" >> "$GITHUB_OUTPUT"; echo "adopt=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG says 'Publisher: local': tools/release.sh PUBLISH=local publishes it from the dev box; nothing to do here"
            exit 0
          fi
          if [[ "$TAG" == *-* ]]; then echo "kind=prerelease" >> "$GITHUB_OUTPUT"
          else echo "kind=release" >> "$GITHUB_OUTPUT"; fi
          # Published already (a rerun): its assets are the release, if they
          # were built from this very tag object. A release the dev box made
          # (PUBLISH=local) is its own: never adopted or completed here.
          state="$(GH_REPO="$GITHUB_REPOSITORY" tools/release-tags.sh state "$TAG")"
          case $state in
            *local)
              echo "kind=local" >> "$GITHUB_OUTPUT"; echo "adopt=false" >> "$GITHUB_OUTPUT"
              echo "::notice::the release $TAG says 'Publisher: local' ($state): tools/release.sh PUBLISH=local publishes it; nothing to do here"
              exit 0 ;;
            published)
              recorded="$(GH_REPO="$GITHUB_REPOSITORY" tools/release-tags.sh tag-object "$TAG")"
              [ "$recorded" = "$(git rev-parse "refs/tags/$TAG")" ] ||
                { echo "::error::the published release $TAG was built from tag object '${recorded:-unrecorded}', not $TAG's $(git rev-parse "refs/tags/$TAG") (a moved or re-pushed tag): not adopting it; fix by hand"; exit 1; }
              echo "adopt=true" >> "$GITHUB_OUTPUT"
              echo "The release $TAG is published (from this tag object): this run takes its assets as the build (no firmware build)" ;;
            draft)
              echo "adopt=false" >> "$GITHUB_OUTPUT"; echo "A draft release $TAG exists: this run completes it" ;;
            none)
              echo "adopt=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected release state '$state'"; exit 1 ;;
          esac
          if [ "$state" != published ] && [ "$HAVE_OTA_SIGNING_KEY" != true ]; then
            echo "::error::the OTA_SIGNING_KEY secret is not set (see the header of release.yml); nothing was published. Set it, then re-run this workflow"
            exit 1
          fi

  release:
    needs: plan
    if: needs.plan.outputs.kind != 'local'
    permissions:
      contents: write
    # Not ubuntu-latest (Ubuntu 26): IDF v5.3's esp-clang 16 needs
    # libxml2.so.2, which 26.04 no longer has.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # The updater's idf.py build dir (the Makefile's default is on the dev box).
      UPDATER_BUILD: ${{ github.workspace }}/target/updater
      VERSION: ${{ needs.plan.outputs.version }}
      KIND: ${{ needs.plan.outputs.kind }}
      TAG: ${{ needs.plan.outputs.tag }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      FINAL: ${{ needs.plan.outputs.final }}
      ADOPT: ${{ needs.plan.outputs.adopt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the web app's version is `git describe --tags`
          submodules: recursive

      - uses: ./.github/actions/web-tools
        with:
          cache-key: firmware

      # ---- the firmware: built and signed, or (a rerun) the published release's

      # fw-release checks the third-party notices against the build.
      - uses: ./.github/actions/cargo-about
        if: env.ADOPT != 'true'

      - uses: ./.github/actions/esp-toolchain
        if: env.ADOPT != 'true'
        id: esp
        with:
          fw-variants: 4mb

      - name: Cache the updater's build
        if: env.ADOPT != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/updater
          key: updater-${{ steps.esp.outputs.image }}-${{ hashFiles('ota/updater/**', 'firmware/.cargo/config.toml') }}
          restore-keys: updater-${{ steps.esp.outputs.image }}-

      - name: Signing key
        if: env.ADOPT != 'true'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/sign"
          if [[ "$KIND" == dry ]]; then
            uv run --quiet tools/fw-sign.py keygen --key "$RUNNER_TEMP/sign/opendmd.key" --pub "$RUNNER_TEMP/sign/dry.pub"
            echo "FW_SIGN_PUB=$RUNNER_TEMP/sign/dry.pub" >> "$GITHUB_ENV"
          else
            test -n "$OTA_SIGNING_KEY" || { echo "::error::the OTA_SIGNING_KEY secret is not set (see the header of release.yml)"; exit 1; }
            printf '%s' "$OTA_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/sign/opendmd.key"
            test "$(stat -c %s "$RUNNER_TEMP/sign/opendmd.key")" -eq 32 || { echo "::error::OTA_SIGNING_KEY does not decode to a 32-byte key"; exit 1; }
          fi
          echo "FW_SIGN_KEY=$RUNNER_TEMP/sign/opendmd.key" >> "$GITHUB_ENV"

      - name: Release build (make fw-release)
        if: env.ADOPT != 'true'
        run: make fw-release

      - uses: ./.github/actions/esp-cache-save
        if: always() && env.ADOPT != 'true'
        with:
          espressif-key: ${{ steps.esp.outputs.espressif-key }}
          espressif-hit: ${{ steps.esp.outputs.espressif-hit }}
          fw-target-key: ${{ steps.esp.outputs.fw-target-key }}
          fw-target-hit: ${{ steps.esp.outputs.fw-target-hit }}
          fw-variants: 4mb

      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/sign/opendmd.key"

      - name: The published release's assets (a rerun)
        if: env.ADOPT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          (cd dist && sha256sum -c SHA256SUMS)

      # ---- checks, on whichever dist/ this is

      - name: Check the version in the images, the manifests, the bundle and the www pack
        run: |
          set -euo pipefail
          pub="${FW_SIGN_PUB:-firmware/keys/opendmd.pub}"
          for v in 4mb; do
            app="dist/opendmd-$VERSION-$v-app.bin"
            desc="$(dd if="$app" bs=1 skip=48 count=32 2>/dev/null | tr -d '\000')"
            echo "$v app descriptor: '$desc'"
            test "$desc" = "$VERSION $v" || { echo "::error::$app's descriptor is '$desc', want '$VERSION $v'"; exit 1; }
            # Remote control (OpenDMD Connect) in betas only, its setting
            # off, and never its measuring half (the Makefile's
            # FW_BETA_FEATURES; tools/release.sh runs the same check).
            tools/release-connect-check.sh "$app" "$VERSION"
            # No emulator lane's test hooks (tools/release.sh runs the same check).
            tools/release-test-features-check.sh "$app"
            manifest="$(jq -r .version "dist/manifest-$v.json")"
            test "$manifest" = "$VERSION" || { echo "::error::dist/manifest-$v.json says $manifest, want $VERSION"; exit 1; }
            # The offline install (docs/deploying.md "Offline installs"): the six
            # parts and the NVS image at the nvs partition, its size.
            read -r nvs_off nvs_size < <(awk -F'[[:space:]]*,[[:space:]]*' '$1 == "nvs" && $3 == "nvs" { print $4, $5 }' firmware/partitions.csv)
            jq -e --slurpfile m "dist/manifest-$v.json" --arg nvs "nvs-offline-$v.bin" --argjson off $(( nvs_off )) --arg ver "$VERSION" '
              .version == $ver and (.builds[0].parts | length) == 7 and ($m[0].builds[0].parts | length) == 6
              and (.builds[0].parts | del(.[2])) == $m[0].builds[0].parts and .builds[0].parts[2] == {path: $nvs, offset: $off}
              and .new_install_prompt_erase == true and .new_install_improv_wait_time == 0' "dist/manifest-$v-offline.json" >/dev/null \
              || { echo "::error::dist/manifest-$v-offline.json is not the six parts and nvs-offline-$v.bin at $nvs_off for $VERSION"; exit 1; }
            test "$(stat -c %s "dist/nvs-offline-$v.bin")" -eq $(( nvs_size )) && test "$(od -An -tx4 -N4 "dist/nvs-offline-$v.bin" | tr -d ' ')" = fffffffe \
              || { echo "::error::dist/nvs-offline-$v.bin is not a $(( nvs_size )) B NVS partition image"; exit 1; }
            uv run --quiet tools/fw-sign.py inspect "dist/opendmd-$VERSION-$v.odfw" | tee "$RUNNER_TEMP/inspect-$v.txt"
            grep -qx "variant  $v" "$RUNNER_TEMP/inspect-$v.txt" || { echo "::error::dist/opendmd-$VERSION-$v.odfw is not a $v bundle"; exit 1; }
            grep -qx "layout   v[0-9]* (current)" "$RUNNER_TEMP/inspect-$v.txt" || { echo "::error::dist/opendmd-$VERSION-$v.odfw is not for this tree's $v partition table"; exit 1; }
            uv run --quiet tools/fw-sign.py verify "dist/opendmd-$VERSION-$v.odfw" --pub "$pub" || { echo "::error::dist/opendmd-$VERSION-$v.odfw does not verify against $pub"; exit 1; }
            ! strings "$app" dist/updater.bin "dist/bootloader-$v.bin" | grep -n "$HOME" || { echo "::error::the release names $HOME"; exit 1; }
            full="dist/opendmd-$VERSION-$v-full.bin"
            want=$(( ${v%mb} * 1024 * 1024 ))
            test "$(stat -c %s "$full")" -eq "$want" || { echo "::error::$full is $(stat -c %s "$full") B, want $want (the $v flash)"; exit 1; }
            echo "$full: $want B"
            # The factory partition the app goes in (firmware/partitions.csv).
            factory=$(( $(awk -F, '$1 ~ /^factory/ { gsub(/ /, "", $5); print $5 }' firmware/partitions.csv) )) size="$(stat -c %s "$app")"
            test $(( factory - size )) -ge 65536 || { echo "::error::$app is $size B: less than 64 KB of the $factory B factory partition spare"; exit 1; }
          done
          # The web app pack's version (its header, docs/www-pack.md): what
          # the player reports as www_version. Settings -> About links this
          # release's API page only when it reads v<version>.
          pack="dist/opendmd-$VERSION-www.pack"
          wv="$(python3 -I -c 'import sys; b = open(sys.argv[1], "rb").read(64); assert b[:4] == b"ODWP"; print(b[20:20 + b[18]].decode())' "$pack")"
          echo "www pack: '$wv'"
          if [[ "$KIND" != dry ]]; then
            test "$wv" = "v$VERSION" || { echo "::error::$pack's version is '$wv', want 'v$VERSION' (a dirty tree or another tag?)"; exit 1; }
          fi
          uv run --quiet tools/fw-sign.py verify-www "$pack" --pub "$pub" >/dev/null || { echo "::error::$pack does not verify against $pub"; exit 1; }
          echo "signed: the bundle and the www pack verify against $pub"

      - name: Collect this version's assets
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p "$RUNNER_TEMP/assets"
          files=("opendmd-$VERSION-www.pack" ota_data_initial.bin updater.bin THIRD-PARTY-LICENSES-firmware.txt THIRD-PARTY-LICENSES-web.txt)
          for v in 4mb; do
            files+=("opendmd-$VERSION-$v-app.bin" "opendmd-$VERSION-$v-full.bin" "opendmd-$VERSION-$v.odfw"
                    "bootloader-$v.bin" "partition-table-$v.bin" "manifest-$v.json" "manifest-$v-offline.json" "nvs-offline-$v.bin")
          done
          for f in "${files[@]}"; do
            cp "dist/$f" "$RUNNER_TEMP/assets/"
          done
          cd "$RUNNER_TEMP/assets"
          if [[ "$ADOPT" == true ]]; then
            # The published release's own SHA256SUMS, and nothing else on it.
            cp "$GITHUB_WORKSPACE/dist/SHA256SUMS" .
            sha256sum -c SHA256SUMS
            test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -printf '%f\n' | sort)" || { echo "::error::$TAG's assets are not the expected set"; exit 1; }
          else
            sha256sum -- * | tee SHA256SUMS
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opendmd-${{ env.VERSION }}-dist
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

      # ---- publish (a real release only)

      - name: Publish the GitHub release
        if: env.KIND == 'release' || env.KIND == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/release-notes.sh "$VERSION" "$CHANNEL" "$RUNNER_TEMP/assets/SHA256SUMS" "$(git rev-parse "refs/tags/$TAG")" ci > "$RUNNER_TEMP/notes.md"
          # Latest only while it is the newest final, asked now (the plan's
          # outputs may be an earlier attempt's): a rerun of an older final
          # never takes "latest" from a newer one.
          git fetch -q --tags --force origin
          latest=false
          [[ "$KIND" != release || "$(tools/release-tags.sh newest-final)" != "$VERSION" ]] || latest=true
          GH_REPO="$GITHUB_REPOSITORY" PUBLISHER=ci RELEASE_LATEST=$latest tools/release-publish.sh "$TAG" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/notes.md"
