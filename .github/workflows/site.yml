name: Site

# Rebuilds the public site and deploys it to Cloudflare (the opendmd-site
# Worker, site/worker/; docs/research/site-cloudflare.md) without a
# release: the docs and pages as they are on the branch or tag picked in
# "Use workflow from", and the installer and update files of an existing
# release, downloaded from its GitHub release (the same signed files the
# release published, checked against its SHA256SUMS). A release tag deploys
# by itself (release.yml); this is for the docs between releases.
#
# Manual only, and it fails at once until the CLOUDFLARE_API_TOKEN secret
# exists (how to make it: the header of release.yml). It never writes to
# the public gallery repo.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "The release whose installer and update files the site offers (a v* tag with a GitHub release)"
        type: string
        required: true

concurrency:
  group: site-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: The Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::the CLOUDFLARE_API_TOKEN secret is not set (see the header of release.yml)"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the web app's version is `git describe --tags`

      - uses: ./.github/actions/web-tools
        with:
          cache-key: site

      - name: The release's files (dist/)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$TAG' is not a v* release tag"; exit 1; }
          mkdir -p dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(jq -r .version dist/manifest-4mb.json)" = "${TAG#v}" || { echo "::error::dist/manifest-4mb.json is not ${TAG#v}"; exit 1; }

      # As in release.yml: the demo card's Kenney (CC0) animations.
      - name: Cache the art demos' GIFs
        id: art-gifs
        uses: actions/cache@v6
        with:
          path: |
            opendmd-web/experiments/art/process/out/b_walk.gif
            opendmd-web/experiments/art/process/out/b_pan.gif
            opendmd-web/experiments/art/process/out/d_scroll.gif
          key: art-gifs-${{ hashFiles('opendmd-web/experiments/art/process/*.py') }}

      - name: The art demos' GIFs
        if: steps.art-gifs.outputs.cache-hit != 'true'
        working-directory: opendmd-web/experiments/art/process
        env:
          ART_TMP: ${{ runner.temp }}/art
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          uv run --quiet fetch_inputs.py
          uv run --quiet demos.py b d
          git checkout -- out

      # As in release.yml: the gallery's contributions and the earlier API
      # pages, read-only from the public gallery repo.
      - name: Fetch the formula gallery and the earlier API pages
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/site-gallery"
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/opendmd/opendmd.github.io "$dir"
          git -C "$dir" sparse-checkout set --no-cone '/gallery/*.psi' '/dev/api/v*.html'
          git -C "$dir" checkout -q
          mkdir -p "$dir/gallery" "$dir/dev/api"

      - name: The public site (make site)
        run: make site GALLERY="$RUNNER_TEMP/site-gallery/gallery" API_ARCHIVE="$RUNNER_TEMP/site-gallery/dev/api" API_FREEZE=auto

      - name: The tree is clean after the build
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Deploy to Cloudflare (cf deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: make site-deploy-built
