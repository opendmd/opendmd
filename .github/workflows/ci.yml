name: CI

# Builds and tests everything on every push and pull request, in three
# parallel jobs on ubuntu-latest:
#
#   host      make test, make clippy (the host crates on stable Rust)
#   web       make web (wasm-pack), then make web-smoke: headless Chromium
#             (Playwright) through every view against tools/mock-device.py,
#             over a card generated by tools/ci-card.py (the real card dump
#             is third-party content and never leaves the dev box)
#   firmware  make fw-release with a throwaway signing key: the xtensa build
#             (espup's esp toolchain, ESP-IDF v5.3 in ~/.espressif), the
#             updater (idf.py), the web app's pack, every size, stack and
#             build-path check, and the signed bundle. The same build as
#             release.yml, so the two share the firmware caches.
#
# The repo is private on the free plan, so minutes count: everything that
# can be is cached (~/.espressif, the esp toolchain, every target dir, uv,
# wasm-pack, Playwright's Chromium). The first firmware run installs ESP-IDF
# (cold: ~30+ min); later ones restore it.
#
# No secrets: the bundle is signed with a key made in the job and checked
# against its own public half (FW_SIGN_PUB), never the committed one.

on:
  push:
  pull_request:

# A newer push to a branch or PR cancels the older run; on main every commit
# runs to the end, so a long cold firmware build still fills the caches.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/web-tools
        with:
          cache-key: host

      - name: Test
        run: make test

      - name: Clippy
        run: make clippy

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # www/version.txt is `git describe`

      - uses: ./.github/actions/web-tools
        with:
          cache-key: web

      - name: Build the web app
        run: make web

      - name: Playwright version
        id: pw
        run: echo "version=$(uv run --quiet --with 'playwright>=1.45' python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and its system libraries
        run: |
          set -euo pipefail
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != true ]; then
            uv run --quiet --with 'playwright==${{ steps.pw.outputs.version }}' playwright install --with-deps chromium
          else
            uv run --quiet --with 'playwright==${{ steps.pw.outputs.version }}' playwright install-deps chromium
          fi

      - name: A synthetic card (tools/ci-card.py)
        run: uv run tools/ci-card.py "$RUNNER_TEMP/ci-card"

      - name: Smoke test (make web-smoke)
        env:
          DMD_CARD_ROOT: ${{ runner.temp }}/ci-card
        run: make web-smoke

      - name: Upload the smoke test's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: target/web-smoke
          retention-days: 7

  firmware:
    runs-on: ubuntu-latest
    env:
      # The updater's idf.py build dir (the Makefile's default is on the dev box).
      UPDATER_BUILD: ${{ github.workspace }}/target/updater
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive # firmware/components/ESP32-HUB75-MatrixPanel-I2S-DMA

      - uses: ./.github/actions/web-tools
        with:
          cache-key: firmware

      - uses: ./.github/actions/esp-toolchain
        id: esp

      - name: Cache the updater's build
        uses: actions/cache@v4
        with:
          path: target/updater
          key: updater-${{ runner.os }}-${{ hashFiles('ota/updater/**', 'firmware/.cargo/config.toml') }}
          restore-keys: updater-${{ runner.os }}-

      - name: A throwaway signing key
        run: |
          set -euo pipefail
          uv run --quiet tools/fw-sign.py keygen --key "$RUNNER_TEMP/ci.key" --pub "$RUNNER_TEMP/ci.pub"
          echo "FW_SIGN_KEY=$RUNNER_TEMP/ci.key" >> "$GITHUB_ENV"
          echo "FW_SIGN_PUB=$RUNNER_TEMP/ci.pub" >> "$GITHUB_ENV"

      - name: Release build (make fw-release)
        run: make fw-release

      - uses: ./.github/actions/esp-cache-save
        if: always()
        with:
          espressif-key: ${{ steps.esp.outputs.espressif-key }}
          espressif-hit: ${{ steps.esp.outputs.espressif-hit }}
          fw-target-key: ${{ steps.esp.outputs.fw-target-key }}
          fw-target-hit: ${{ steps.esp.outputs.fw-target-hit }}

      - name: The tree is clean after the build
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Remove the throwaway key
        if: always()
        run: rm -f "$RUNNER_TEMP/ci.key"
