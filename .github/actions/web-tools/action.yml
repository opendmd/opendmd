name: Host Rust and web tools
description: >
  Stable Rust with clippy and the wasm32 target, wasm-pack (which fetches
  wasm-bindgen and wasm-opt into ~/.cache/.wasm-pack on first use), uv, node
  (make test's card-test runs under it), and
  the caches: the crates' target dirs (Swatinem/rust-cache, keyed on each
  Cargo.lock), wasm-pack's downloads, uv's cache.

inputs:
  wasm-pack:
    default: "0.15.0"
  cache-key:
    description: "Distinguishes the target-dir cache of jobs that build different things"
    required: true

runs:
  using: composite
  steps:
    - name: Stable Rust, clippy, wasm32
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal -c clippy -t wasm32-unknown-unknown
        rustc +stable --version

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: |
          opendmd-core
          opendmd-render
          opendmd-sim
          opendmd-web
          opendmd-art-web
          opendmd-studio-web
          opendmd-pack

    - name: Cache wasm-pack and its downloads
      id: wasm-pack
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/wasm-pack
          ~/.cache/.wasm-pack
        key: wasm-pack-${{ runner.os }}-${{ inputs.wasm-pack }}-${{ hashFiles('opendmd-web/Cargo.lock', 'opendmd-art-web/Cargo.lock', 'opendmd-studio-web/Cargo.lock') }}
        restore-keys: wasm-pack-${{ runner.os }}-${{ inputs.wasm-pack }}-

    - name: Install wasm-pack
      if: steps.wasm-pack.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        v=${{ inputs.wasm-pack }}
        mkdir -p ~/.cargo/bin "$RUNNER_TEMP/wp"
        gh release download -R rustwasm/wasm-pack "v$v" -p "wasm-pack-v$v-x86_64-unknown-linux-musl.tar.gz" -D "$RUNNER_TEMP/wp"
        tar -xzf "$RUNNER_TEMP/wp/wasm-pack-v$v-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/wp"
        install -m 755 "$RUNNER_TEMP/wp/wasm-pack-v$v-x86_64-unknown-linux-musl/wasm-pack" ~/.cargo/bin/wasm-pack
        wasm-pack --version

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: "tools/*.py"

    # node, explicitly: make card-test (in make test) needs 20.12+ for
    # DecompressionStream('deflate-raw').
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
