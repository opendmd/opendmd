name: Save the ESP32 caches
description: >
  Saves what ./.github/actions/esp-toolchain restored when it missed: ESP-IDF
  (~/.espressif) once it is complete, firmware/target once cargo has linked
  the release ELF of every layout the job builds (fw-variants, as given to
  esp-toolchain). Run it with `if: always()` straight after the build, so a
  failure later in the job still keeps them.

inputs:
  espressif-key:
    required: true
  espressif-hit:
    required: true
  fw-target-key:
    required: true
  fw-target-hit:
    required: true
  fw-variants:
    default: "4mb"

runs:
  using: composite
  steps:
    - name: What is complete
      id: check
      shell: bash
      run: |
        idf=false fw=false
        # Every tool esp-idf-sys installs (idf_tools.py removes one that
        # fails its check), the checkout and the venv.
        if [ -d ~/.espressif/esp-idf/v5.3/.git ] \
           && ls ~/.espressif/python_env/idf5.3_py3*_env/bin/python >/dev/null 2>&1; then
          idf=true
          for t in xtensa-esp-elf esp-clang esp-rom-elfs cmake ninja esp32ulp-elf; do
            [ -n "$(ls -A ~/.espressif/tools/$t 2>/dev/null)" ] || { echo "missing tool: $t"; idf=false; }
          done
        fi
        # Each layout's release ELF (the Makefile's FW_RELEASE_VTARGET: 4mb in
        # firmware/target, any other in firmware/target/v<layout>).
        fw=true
        for v in ${{ inputs.fw-variants }}; do
          d=firmware/target; [ "$v" = 4mb ] || d=firmware/target/v$v
          [ -f "$d/xtensa-esp32-espidf/release/opendmd-firmware" ] || { echo "no $v release ELF"; fw=false; }
        done
        echo "ESP-IDF complete: $idf; release ELFs linked (${{ inputs.fw-variants }}): $fw"
        echo "idf=$idf" >> "$GITHUB_OUTPUT"
        echo "fw=$fw" >> "$GITHUB_OUTPUT"

    - name: Save ESP-IDF (~/.espressif)
      if: inputs.espressif-hit != 'true' && steps.check.outputs.idf == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.espressif
          !~/.espressif/dist
        key: ${{ inputs.espressif-key }}

    - name: Save firmware/target
      if: inputs.fw-target-hit != 'true' && steps.check.outputs.fw == 'true'
      uses: actions/cache/save@v6
      with:
        path: firmware/target
        key: ${{ inputs.fw-target-key }}
