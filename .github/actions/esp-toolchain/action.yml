name: ESP32 toolchain
description: >
  The xtensa Rust toolchain (espup's `esp`, with its ~/.espup-env.sh, which
  the Makefile sources), ldproxy and espflash; and restores the caches of
  ESP-IDF v5.3 in ~/.espressif (installed "global" by esp-idf-sys on the
  first firmware build, see firmware/.cargo/config.toml) and of
  firmware/target. Those two are saved by ./.github/actions/esp-cache-save
  after the build, even when a later step fails, so a failed run does not
  install ESP-IDF again. The versions are the ones on the development
  machine.

inputs:
  espup:
    default: "0.17.1"
  esp-rust:
    description: "The esp toolchain (rustc +esp --version: 1.97.0-nightly ... (1.97.0.0))"
    default: "1.97.0.0"
  espflash:
    default: "4.6.0"
  ldproxy:
    default: "0.3.5"

outputs:
  image:
    description: "runner.os-ImageOS, for the caller's own cache keys"
    value: ${{ steps.keys.outputs.image }}
  espressif-key:
    value: ${{ steps.keys.outputs.espressif }}
  espressif-hit:
    value: ${{ steps.espressif.outputs.cache-hit }}
  fw-target-key:
    value: ${{ steps.keys.outputs.fw-target }}
  fw-target-hit:
    value: ${{ steps.fw-target.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Keyed on the runner image too (ImageOS, e.g. ubuntu24): ldproxy is
    # built against its glibc, the IDF venv against its Python.
    - name: Cache keys
      id: keys
      shell: bash
      run: |
        image="${{ runner.os }}-${ImageOS:-unknown}"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "rust=esp-rust-$image-espup${{ inputs.espup }}-${{ inputs.esp-rust }}-espflash${{ inputs.espflash }}-ldproxy${{ inputs.ldproxy }}" >> "$GITHUB_OUTPUT"
        echo "espressif=espressif-$image-${{ hashFiles('firmware/.cargo/config.toml') }}" >> "$GITHUB_OUTPUT"
        echo "fw-target=fw-target-$image-${{ hashFiles('firmware/Cargo.lock', 'firmware/.cargo/config.toml', 'firmware/sdkconfig.defaults') }}" >> "$GITHUB_OUTPUT"

    - name: Restore the esp toolchain, espflash and ldproxy
      id: esp-rust
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.rustup/toolchains/esp
          ~/.espup-env.sh
          ~/.cargo/bin/espup
          ~/.cargo/bin/espflash
          ~/.cargo/bin/ldproxy
        key: ${{ steps.keys.outputs.rust }}

    - name: Install espup, the esp toolchain, espflash and ldproxy
      if: steps.esp-rust.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p ~/.cargo/bin "$RUNNER_TEMP/esp-dl"
        cd "$RUNNER_TEMP/esp-dl"
        gh release download -R esp-rs/espup "v${{ inputs.espup }}" -p 'espup-x86_64-unknown-linux-gnu.zip'
        gh release download -R esp-rs/espflash "v${{ inputs.espflash }}" -p 'espflash-x86_64-unknown-linux-gnu.zip'
        unzip -o -q espup-x86_64-unknown-linux-gnu.zip -d ~/.cargo/bin
        unzip -o -q espflash-x86_64-unknown-linux-gnu.zip -d ~/.cargo/bin
        chmod +x ~/.cargo/bin/espup ~/.cargo/bin/espflash
        # No ldproxy release binary is newer than 0.3.2; build the one we use.
        cargo install --locked ldproxy --version "${{ inputs.ldproxy }}"
        ~/.cargo/bin/espup install --targets esp32 --toolchain-version "${{ inputs.esp-rust }}" \
          --export-file ~/.espup-env.sh
        rm -rf ~/.rustup/downloads ~/.rustup/tmp

    - name: Save the esp toolchain, espflash and ldproxy
      if: steps.esp-rust.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.rustup/toolchains/esp
          ~/.espup-env.sh
          ~/.cargo/bin/espup
          ~/.cargo/bin/espflash
          ~/.cargo/bin/ldproxy
        key: ${{ steps.keys.outputs.rust }}

    - name: Show the toolchain
      shell: bash
      run: |
        set -euo pipefail
        cat ~/.espup-env.sh
        . ~/.espup-env.sh
        rustc +esp --version
        espflash --version

    # ~/.espressif: the ESP-IDF checkout, its tools and Python venv (~2.5 GB).
    # The downloaded archives in dist/ are left out.
    - name: Restore ESP-IDF (~/.espressif)
      id: espressif
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.espressif
          !~/.espressif/dist
        key: ${{ steps.keys.outputs.espressif }}

    - name: Restore firmware/target
      id: fw-target
      uses: actions/cache/restore@v6
      with:
        path: firmware/target
        key: ${{ steps.keys.outputs.fw-target }}
        restore-keys: fw-target-${{ steps.keys.outputs.image }}-
