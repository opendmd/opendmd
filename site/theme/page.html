<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">
<meta name="description" content="{description}">
<title>{title}</title>
<link rel="preload" href="{up}fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{up}fonts/silkscreen.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{up}site.css">{head}
</head>
<body class="{kind}">
{header}
<div class="{wrap}">{side}
<main id="main">
{subnav}{body}
</main>
</div>
{footer}
</body>
</html>
