[package]
name = "opendmd-render"
version = "1.0.0-beta.1"
edition = "2021"
description = "Shared LED-panel renderer for OpenDMD: draws a 128x32 canvas as a P4 HUB75 panel."
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendmd/opendmd"
publish = false

[dependencies]
opendmd-core = { path = "../opendmd-core" }

# The vendored gif 0.13.3 reaches this crate through opendmd-core; the patch
# has to be repeated because each crate here has its own lockfile.
# See third_party/gif/README-OPENDMD.md
[patch.crates-io]
gif = { path = "../third_party/gif" }
