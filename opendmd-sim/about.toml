# cargo-about (pinned in release.yml and the Makefile): the third-party
# licence notices shipped in the simulator's download archives
# (THIRD-PARTY-LICENSES.txt, rendered with about.hbs). A dependency under
# a licence not listed here fails the build: check it before adding it.
# Where a crate offers a choice, the first accepted licence in this order
# is the one listed.
accepted = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0"]
# Our own crates (publish = false) are under the simulator's own licence,
# which the archive carries as LICENSE-MIT.txt and LICENSE-APACHE.txt.
private = { ignore = true }
