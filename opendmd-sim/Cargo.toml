[package]
name = "opendmd-sim"
version = "1.0.0-beta.17"
edition = "2021"
description = "Desktop simulator for OpenDMD: plays a card's GIFs in a 128x32 window."
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendmd/opendmd"
publish = false

[dependencies]
opendmd-core = { path = "../opendmd-core" }
opendmd-render = { path = "../opendmd-render" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
minifb = "0.28"
png = "0.17"
# The folder picker when started with no card (double-clicked). On Linux
# through the XDG desktop portal (D-Bus, pure Rust): no GTK at build or run time.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[features]
# Psi formulas (`--formula FILE.psi`, `--play '@formula?src=…'`): on by
# default (Formulas are the panel's only effects; the demo card and the
# site's art are recorded from them). `--no-default-features` builds without.
default = ["psi"]
psi = ["opendmd-core/psi-compiler"]

# Vendored gif 0.13.3 with a one-line LZW allocation fix; see third_party/gif/README-OPENDMD.md
[patch.crates-io]
gif = { path = "../third_party/gif" }
