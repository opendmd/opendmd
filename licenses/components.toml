[[package]]
id = "gcc-runtime"
name = "GCC runtime libraries (libstdc++, libgcc)"
url = "https://gcc.gnu.org/"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
texts = ["toolchain:gcc/COPYING.RUNTIME"]
expect = "GCC RUNTIME LIBRARY EXCEPTION"
note = """Linked from Espressif's GCC toolchain for the C++ HUB75 driver. The \
GCC Runtime Library Exception lets a program compiled with GCC include \
these libraries under terms of its choice: no source or licence \
obligations follow; it is reproduced for information."""

[[package]]
id = "mdns"
