[package]
name = "opendmd-art"
version = "1.1.0-beta.4"
edition = "2021"
description = "Create Art's pipeline: any picture or GIF in, a 128x32 GIF out (one global palette). No browser types: the web app's wasm module (opendmd-art-web) wraps it, and native callers link it as it is."
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendmd/opendmd"
publish = false

[dependencies]
# The player's GIF decoder (`player::GifSource`: disposal and transparency
# composited as the panel shows them), the canvas and the text overlay's
# fonts. No features: the web crate adds its own.
opendmd-core = { path = "../opendmd-core" }
gif = "0.13"            # the encoder: one global palette, every frame whole
# An animated WebP's frames (src/webp.rs, feature `webp`): the site's WebP
# reader links it, loaded only when one is imported; the web app's own wasm
# (opendmd-art-web) does not. Pure Rust, no default features.
image-webp = { version = "0.2", optional = true }

[features]
webp = ["dep:image-webp"]

# The tests also run compiled to wasm under node (`make test-wasm`); natively
# nothing of wasm-bindgen is built.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The vendored gif 0.13.3 (see third_party/gif/README-OPENDMD.md); a patch is
# per-lockfile, so every crate repeats it.
[patch.crates-io]
gif = { path = "../third_party/gif" }
