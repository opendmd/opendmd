[package]
name = "opendmd-webmin"
version = "1.0.0-beta.17"
edition = "2021"
description = "make web's minifier: each of the web app's scripts (oxc) and stylesheets (lightningcss) on its own, no bundling."
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendmd/opendmd"
publish = false

[dependencies]
oxc_allocator = "=0.157.0"
oxc_codegen = "=0.157.0"
oxc_compat = "=0.157.0"
oxc_minifier = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }

[profile.release]
debug = false
