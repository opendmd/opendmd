[package]
name = "opendmd-pack"
version = "1.0.0-beta.14"
edition = "2021"
description = "Prepares a card: every GIF's prepared copy (a capped-LZW delta GIF) under cache/."
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendmd/opendmd"
publish = false

[dependencies]
opendmd-core = { path = "../opendmd-core", features = ["tween"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
gif = "0.13"

[profile.release]
debug = false

# Vendored gif 0.13.3 with a one-line LZW allocation fix; see third_party/gif/README-OPENDMD.md
[patch.crates-io]
gif = { path = "../third_party/gif" }
