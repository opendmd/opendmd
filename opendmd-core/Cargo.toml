[package]
name = "opendmd-core"
version = "1.0.1"
edition = "2021"
description = "Platform-independent core for OpenDMD: 128x32 canvas, GIF playback, manifest/tag parsing, playlist engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendmd/opendmd"
publish = false

[dependencies]
gif = "0.13"
log = "0.4"
# Firmware bundles (src/ota.rs, `ota` feature): verify-only Ed25519 and the
# image's SHA-256. No `rand`, no `std` requirement, no zeroize: the device
# only ever holds the public key.
ed25519-dalek = { version = "3", default-features = false, features = ["fast"], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
# Psi, the per-pixel effects language (`psi` feature, a spike): without
# its own tables — `fx_psi` lends it fx's sine and palettes.
opendmd-psi = { path = "../opendmd-psi", default-features = false, optional = true }

[dev-dependencies]
# Psi's own tables, for the test that core lends identical ones (dev
# features are not unified into normal builds).
opendmd-psi = { path = "../opendmd-psi" }

[features]
# The ESP32 build with SRAM1 as IRAM (opendmd-psi's `sram1-iram`): more hot
# functions in IRAM.
sram1-iram = ["opendmd-psi?/sram1-iram"]
# Smooth motion (src/tween.rs): the shift tweener for prepared copies. Only
# opendmd-pack and the art wasm module enable it; the firmware never does.
tween = []
# Building a GIF's name from its fields (`manifest::NameFields`, `build_name`):
# the web app's Add GIFs / Edit details, through the art wasm module. Behind a
# feature because its mere presence moved the main wasm module's inlining
# (+150-250 B gz there, where there is ~1 KB left) though it never calls it.
names = []
# The signed firmware bundle (src/ota.rs): the firmware and the tests only,
# so the wasm modules never see the crypto crates.
ota = ["dep:ed25519-dalek", "dep:sha2"]
# The device's player (the firmware enables it, always): built without
# `psi` (the firmware's `formulas` off), a playlist's Formula lines
# (`@formula…`, `/formulas/<stem>.psi`) are skipped as they are read, like
# a retired effect's, so the rest plays. (The host crates, which edit
# playlists, never enable it.) On the ESP32 without `psi`, the GIF path's
# hottest code also goes in the IRAM the Formulas' code would take
# (tools/check-iram.py REQUIRED_NO_FORMULAS).
player = []
# Psi formulas, the panel's only effects, `@formula?psb=…` (src/fx_psi.rs):
# off by default here; the firmware and the simulator turn it on. The
# player loads compiled Formulas only (opendmd-psi's `psb`).
psi = ["dep:opendmd-psi"]
# The compiler too, for the host's tools (the simulator, psi-probe's
# builds): `fx_psi::path` of a source.
psi-compiler = ["psi", "opendmd-psi/compiler"]
# psi-probe's counters (`psi::stats`).
psi-stats = ["psi", "opendmd-psi/stats"]
# The narrow JIT (opendmd-psi's `jit`): a formula's pixel stage as Xtensa
# code on the ESP32 (only there: on any other target the feature does
# nothing), checked against the VM when it opens.
psi-jit = ["psi", "opendmd-psi/jit"]

# Vendored gif 0.13.3 with a one-line LZW allocation fix; see third_party/gif/README-OPENDMD.md
[patch.crates-io]
gif = { path = "../third_party/gif" }
