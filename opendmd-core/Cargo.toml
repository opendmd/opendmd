[package]
name = "opendmd-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent core for OpenDMD: 128x32 canvas, GIF playback, manifest/tag parsing, playlist engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rossduggan/opendmd"
publish = false

[dependencies]
color_quant = "1.1"
gif = "0.13"
log = "0.4"

[features]
# Smooth motion (src/tween.rs): the shift tweener for prepared copies. Only
# opendmd-pack and the art wasm module enable it; the firmware never does.
tween = []

# Vendored gif 0.13.3 with a one-line LZW allocation fix; see third_party/gif/README-OPENDMD.md
[patch.crates-io]
gif = { path = "../third_party/gif" }
