# opendmd-connect-s0: OpenDMD Connect spike S0's scratch echo Worker
# (src/index.js). Throwaway: delete it after S0.
#
# Deploying is the maintainer's (nothing in the repo runs it):
#   cd connect/s0-echo && npm ci
#   npx wrangler login                       # or CLOUDFLARE_API_TOKEN in the environment
#   npx wrangler secret put S0_SECRET        # once, before the first deploy (the panel's ?k=)
#   npx wrangler deploy
# Removing it afterwards:
#   npx wrangler delete opendmd-connect-s0
#
# Local test, no account: `npm test` (Miniflare, test/echo.test.mjs).

name = "opendmd-connect-s0"
main = "src/index.js"
compatibility_date = "2026-10-20"

# Only on its own hostname: no workers.dev, no preview URLs.
workers_dev = false
preview_urls = false
routes = [{ pattern = "connect-s0.opendmd.dev", custom_domain = true }]

# One SQLite-backed Durable Object class (the only kind on every plan),
# with hibernating WebSockets (src/index.js: acceptWebSocket, the ping
# auto-response).
[[durable_objects.bindings]]
name = "ECHO"
class_name = "EchoS0"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EchoS0"]

# No logs of any kind: invocation logs off, and nothing is collected.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
