[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
# sha2's compact software rounds instead of the fully unrolled ones: the
# unrolled SHA-512 compress alone was 50 KB of flash (Ed25519 hashes with
# it, in src/ota.rs), SHA-256's 13 KB. Speed is irrelevant here: one
# 2 MB image hashed per firmware update.
rustflags = ["--cfg", 'sha2_backend_soft="compact"']

[unstable]
build-std = ["std", "panic_abort"]
# None of std's default features: `backtrace` linked a whole DWARF
# symbolizer (gimli, addr2line, object, miniz_oxide and the generics they
# drag in: 142,096 B of the 2,290,976 B release image) that nothing calls:
# no code uses `std::backtrace`, and a panic's backtrace is ESP-IDF's,
# printed from the registers by its panic handler (decoded on the host
# against the ELF, which keeps its debug info). `panic-unwind` goes too
# (the target aborts on a panic anyway). Not `compiler-builtins-mem`
# either: memcpy and friends stay the ROM's (newlib's, at 0x4000c2c8 and
# so on), as before.
build-std-features = []

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.3"
# Deliberate difference from stripe-dashboard, which installs ESP-IDF into an
# in-project `.embuild/`: here the framework lives in `~/.espressif` and is
# shared with every other esp-idf project on the machine. One 5-10 minute
# clone instead of one per repo, and `cargo clean` does not throw it away.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
