[package]
name = "opendmd-firmware"
version = "1.1.0-beta.2"
edition = "2021"
resolver = "2"
description = "OpenDMD ESP32 firmware: plays 128x32 GIFs from microSD onto two chained HUB75 panels"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Pinned to versions already proven together in an esp-idf std Rust project
# on this exact chip.
esp-idf-hal = "0.45"
esp-idf-svc = { version = "0.51", features = ["experimental"] }
esp-idf-sys = "0.36"
# `ota`: the signed firmware bundle's verifier (Ed25519, SHA-256), src/ota.rs.
opendmd-core = { path = "../opendmd-core", features = ["ota", "player"] }
anyhow = "1"
log = "0.4"
# The JSON API. Responses are formatted by hand (see `httpd::json_string`) so
# that the streaming endpoints never build a whole body in RAM; serde_json is
# here for parsing request bodies, where correctness beats bytes.
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[features]
# SRAM1 as IRAM (sdkconfig ESP_SYSTEM_ESP32_SRAM1_REGION_AS_IRAM, set by the
# Makefile with this: FW_SRAM1_IRAM=1): up to 40 KB more IRAM, taken from the
# top of the D/IRAM heap byte for byte, for the next hottest functions.
sram1-iram = ["opendmd-core/sram1-iram"]
# The emulator's no-card lane (`make emu-nocard`, src/nocard_test.rs): a
# settings change with no card, kept across a restart. Never in a release.
nocard-test = []
# The emulator's rig lane with a test board's heap (`make emu-rig-tight`):
# heap taken and kept at boot until ~45 KB is free while playing (the
# spare, 2026-11-03: 42-48 KB). Never in a release.
emu-ballast = []
# The emulator's leak lane (`make emu-leak`): the heap's block count and
# bytes in use logged every 20 s (`census:`), checked flat across 40+ GIFs.
# Never in a release.
emu-census = []
# The components a build can leave out (opendmd-notes docs/notes/firmware-build.md
# "Feature flags"): all on by default, releases included; the Makefile's
# FW_DISABLE=<name>[,<name>] builds without (`/api/status` and
# `/api/firmware` `features` list what a build has).
# - `formulas`: Formulas on the panel: the Psi player, the bundled
#   Formulas, Formula looks, `@formula…`/`/formulas/*.psi` playback, the
#   formula arena, the raced pairs and upload pacing (both only for
#   Formulas). Off: `/api/play` of one is a 501, a `look_formula` a 400,
#   a playlist's Formula lines are skipped, the web app hides them, and
#   the GIF path's hottest code goes in the IRAM they leave (~0.3 MB of
#   flash back).
# - `jit`: the narrow JIT for Formulas (needs `formulas`).
default = ["formulas", "jit"]
formulas = ["psi"]
# Bench WiFi credentials from `firmware/.env`, compiled in as an NVS seed
# (see `nvs_config.rs`). On for `make fw-build`/`fw-flash`/`fw-clippy`, OFF for
# `make fw-release`: without it the `option_env!` reads do not exist in the
# crate, so a release image cannot carry a credential.
dev-credentials = []
# Timing instrumentation (src/probe.rs): SD opens/reads/rewinds, blit time and
# pixels, deadline-miss attribution, and a blit benchmark at boot. Off by
# default and compiled out entirely. `make fw-build FW_FEATURES=probe`.
probe = []
# Also log every httpd open/listing/transfer (costs UART time on CPU0).
probe-http = ["probe"]
# Measurements only: never open the next file ahead (src/ahead.rs), so a
# probe build with and without it differ in nothing else.
ahead-off = []
# Heap-corruption diagnostics (src/diag.rs): heap walks at every handler,
# stream, Follow poll and heartbeat, and a check of the handler table; the
# Makefile adds sdkconfig.diag (comprehensive heap poisoning, end-of-stack
# watchpoint). Off by default, compiled out. `make fw-build FW_FEATURES=diag-heap`.
diag-heap = []
# The heap map (src/heapmap.rs): start-up checkpoints, the task table and a
# census of every heap block (Rust ones by call site) on the console and in
# `/api/status?heapmap=1`. A diagnostic build only: the Makefile adds
# FreeRTOS's trace facility for it (`FW_RELEASE_FEATURES=heapmap`).
heapmap = []
# Psi formulas, the code's name for `formulas` (opendmd-core's `psi`; the
# probes below depend on it): enable `formulas`, not this.
# The compiler with it (`card_formulas`: the card's Formulas prepared when
# it is mounted, ~145 KB of code).
psi = ["opendmd-core/psi", "opendmd-core/psi-compiler"]
# The narrow JIT (opendmd-notes docs/research/psi-jit-esp32.md, phase 1): a Formula's
# pixel stage as Xtensa code in executable heap, checked against the VM at
# its first frame; `formula_jit` in /api/config turns it off. In every
# build; `--no-default-features --features psi` builds without.
jit = ["formulas", "opendmd-core/psi-jit"]
# OpenDMD Connect's spike S0 (src/connect_probe.rs): a TLS WebSocket
# client probe in the network worker, its test hooks under
# /api/debug/connect and `connect` in /api/status. A measurement build
# only, never a release: the Makefile layers firmware/sdkconfig.connect-probe
# on whenever it is on (dynamic TLS buffers, session tickets, the
# trusted-certificate callback, one more socket), so the build without it
# is today's, bit for bit. `make fw-release FW_RELEASE_FEATURES=connect-probe`.
connect-probe = ["connect-core", "connect-measure"]
# The probe's two halves (M1 is measured on `connect-core` alone):
# - `connect-core`: the session itself (TLS, the WebSocket client, the
#   pinned roots, backoff, DNS, the crash guard), starting by itself after
#   the hold, to the build-time host;
# - `connect-measure`: what only measuring needs (the `connect` telemetry,
#   the /api/debug/connect hooks, M9, M10, the mbedTLS byte counters, the
#   handshake histograms).
connect-core = ["opendmd-core/connect"]
connect-measure = ["connect-core"]
# ESP32-S3 measurement switches (S3 port phase 1, `make fw-s3-image`;
# refused on the classic): mbedTLS's allocations from PSRAM (the Connect
# probe's allocator, with sdkconfig's MBEDTLS_EXTERNAL_MEM_ALLOC for IDF's
# own), and the cold buffers (`arena::cold`: Rust allocations of 1 KB or
# more off the display task) from PSRAM.
psram-tls = []
psram-cold = ["psi"]
# Bench test hooks that a release does without: card speed's
# `POST /api/card/full-speed?test_errors=N` (`cardspeed.rs`). On for
# `make fw-build`/`fw-flash`/`fw-clippy` (with `dev-credentials`); a
# release measurement build adds it with `FW_RELEASE_FEATURES=bench`.
bench = []
# The Psi spike's measurement (src/psi_probe.rs): frame times, the golden
# frames, per-step costs and the stack, logged once at boot (`psi-probe:`
# lines). `make fw-release FW_RELEASE_FEATURES=psi-probe` for a test panel: alone,
# not with `probe`, whose frame-timing histograms are ~12.5 KB of .bss (the
# start heap lang-probe-a lacked, 2026-10-28).
psi-probe = ["psi", "opendmd-core/psi-stats", "opendmd-core/psi-compiler"]
# The paint probe (src/paint_probe.rs): the paint steps, the overlay and
# `under(x, y)` timed against the cost model, once at boot (`psi-probe:
# paint:` lines, /filelist-paint-probe.txt). No compiler (build.rs compiles
# its cases): it fits the 4mb layout. `make emu-image-paint`.
paint-probe = ["psi", "opendmd-core/psi-stats"]

[build-dependencies]
embuild = { version = "0.32", features = ["espidf"] }
# The built-in bundled Formulas are compiled at build time (build.rs); the
# card's are compiled on the display when it mounts the card (`psi`).
opendmd-psi = { path = "../opendmd-psi", default-features = false, features = ["compiler"] }
# The embedded setup page is rendered and gzipped at build time, the same way
# ~/projects/stripe-dashboard does it.
flate2 = "1"
tera = { version = "1", default-features = false }

# The HUB75 DMA driver and our C shim are built as ESP-IDF components and
# bound with bindgen into `esp_idf_sys::hub75`. `component_dirs` points at the
# directory *containing* components, so both `hub75_shim/` and the
# `ESP32-HUB75-MatrixPanel-I2S-DMA/` submodule are picked up (the submodule's
# directory name is the IDF component name our CMakeLists REQUIRES).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]
bindings_header = "components/hub75_shim/include/hub75_shim.h"
bindings_module = "hub75"

# mDNS is a managed component rather than part of ESP-IDF proper; pulling it in
# here is what makes `esp_idf_svc::mdns` compile (it is behind
# `esp_idf_comp_espressif__mdns_enabled`). This is what puts the player on the
# network as `opendmd.local`.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

[profile.dev]
opt-level = 2          # ESP-IDF drivers misbehave below opt-level 2
debug = true

[profile.release]
opt-level = 2
debug = true           # keep symbols so panics decode to line numbers
lto = "off"            # ESP-IDF does not tolerate LTO well
# One codegen unit: the image is 19.2 KB smaller (2,247,312 -> 2,228,128 B
# on the sector-512 tree), and a change's size is its own: with 16 units a
# new module reshuffled inlining by 6-7 KB elsewhere. Costs ~12 s of build
# (firmware crate 42 -> 54 s, clean 57 -> 69 s on the build host). Every
# firmware build ships through this profile: fw-build (bench, probe, diag),
# fw-release, CI and release.yml.
codegen-units = 1

# Size, not speed, for dependencies no frame runs (opendmd-notes docs/research/size-budget.md
# "fw-size"): request-body JSON (serde, serde_json; zmij is the float printer
# behind serde_json's error text, and at "s" it drops its 16.8 KB table), the
# update signature check (Ed25519 and SHA-2, one bundle per update), and
# esp-idf-svc/embedded-svc (WiFi, NVS, mDNS, event loop wrappers: CPU0 and
# start-up). -39.6 KB of the 4mb image together (2,290,480 -> 2,250,848 B).
# Measured and left at 2: std/alloc/core (+50 KB: their inline code is
# less inlinable from callers), esp-idf-hal, log and the small utility
# crates (anyhow, heapless, itoa, memchr, chrono: +1-8 KB). Generic code
# (serde's deserializers for our types) is compiled in the crate that
# uses it, at its level. The display's crates stay at 2: opendmd-core,
# opendmd-psi, gif/weezl/color_quant, the firmware itself (their cold
# code takes `#[optimize(size)]` per function instead).
[profile.release.package.serde]
opt-level = "s"
[profile.release.package.serde_core]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
[profile.release.package.zmij]
opt-level = "s"
[profile.release.package.curve25519-dalek]
opt-level = "s"
[profile.release.package.ed25519-dalek]
opt-level = "s"
[profile.release.package.ed25519]
opt-level = "s"
[profile.release.package.sha2]
opt-level = "s"
[profile.release.package.digest]
opt-level = "s"
[profile.release.package.block-buffer]
opt-level = "s"
[profile.release.package.crypto-common]
opt-level = "s"
[profile.release.package.hybrid-array]
opt-level = "s"
[profile.release.package.signature]
opt-level = "s"
[profile.release.package.subtle]
opt-level = "s"
[profile.release.package.esp-idf-svc]
opt-level = "s"
[profile.release.package.embedded-svc]
opt-level = "s"

# Vendored gif 0.13.3 with a one-line LZW allocation fix; see third_party/gif/README-OPENDMD.md
[patch.crates-io]
gif = { path = "../third_party/gif" }
